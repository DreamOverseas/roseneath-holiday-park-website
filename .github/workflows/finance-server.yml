name: Check production Strapi
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            unit=strapi-media360.service
            systemctl show --no-pager "$unit" -p User -p NoNewPrivileges -p ActiveState -p WorkingDirectory
            systemctl is-active --quiet "$unit"
            test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:1337/_health)" = 204
            test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:1337/api/rhp-admin/login)" = 401
            test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:1337/api/rhp-finance)" = 403
