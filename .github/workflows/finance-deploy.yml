name: Deploy Strapi finance module
on:
  workflow_dispatch:
concurrency:
  group: deploy-main
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            cd /home/ecs-user/roseneath-holiday-park-website
            git fetch origin main
            stage=$(mktemp -d /tmp/rhp-finance-deploy.XXXXXX)
            trap 'rm -rf -- "$stage"' EXIT
            git archive origin/main backend/strapi scripts | tar -x -C "$stage"
            bash "$stage/scripts/deploy-finance.sh" "$stage"
